<!DOCTYPE html>
<html>
    <head>
        <title>Pagina do Gabriel</title>
    </head>
    <body>
        <h1>Atividade 01 - Gabriel Leonel</h1>
        <form>
            
            <label for="username">Nome de Usuario:</label><br>
            <input type="text" id="username" name="username"><br>
            
            <label for="email">Digite o seu Email:</label><br>
            <input type="email" id="email" name="email"><br>
            
            <label for="pwd">Digite sua senha:</label><br>
            <input type="password" id="pwd" name="pwd"><br>

            <label for="idade">Qual a sua idade?</label><br>
            <input type="number" id="idade" name="idade"><br>

            <label for="nascimento">Data de Nascimento:</label><br>
            <input type="date" id="nascimento" name="nascimento"><br>
            
            <label for="perfilgithub">Link do perfil GitHub:</label><br>
            <input type="url" id="perfilgithub" name="perfilgithub"><br>

            <p>Qual seu tipo de comida favorito?</p>
            <input type="radio" id="doce" name="tipo_comida" value="Doce">
            <label for="doce">Doce</label><br>
            <input type="radio" id="salgado" name="tipo_comida" value="Salgado">
            <label for="salgado">Salgado</label><br>

            <label for="cor_fav">Qual a sua cor favorita?</label><br>
            <input type="color" id="cor_fav" name="cor_fav"><br>

            <p>Você vai para a faculdade:</p>
            <input type="checkbox" id="opcao1" name="opcao1" value="A pé">
            <label for="opcao1"> Vou a pe</label><br>
            <input type="checkbox" id="opcao2" name="opcao2" value="De bicicleta">
            <label for="opcao2"> De bicicleta</label><br>
            <input type="checkbox" id="opcao3" name="opcao3" value="De carro">
            <label for="opcao3"> De carro</label><br>
            <input type="checkbox" id="opcao4" name="opcao4" value="De ônibus">
            <label for="opcao4"> De onibus</label><br>

            <label for="satisfacao">Nível de satisfação (0 a 10)</label>
            <input type="range" id="satisfacao" name="satisfacao" min="0" max="10">
            <input type="submit" value="Submit">

        </form>
    </body>
</html>
